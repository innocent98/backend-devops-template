name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '{{PY_VERSION}}'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: {{POETRY_VERSION}}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --no-root --with dev

      - name: Lint with ruff
        run: poetry run ruff check app/

      - name: Check formatting with black
        run: poetry run black --check app/

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '{{PY_VERSION}}'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: {{POETRY_VERSION}}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --no-root --with dev

      # All non-trivial CI env values come from repo secrets.
      # Set them once under: Settings → Secrets and variables → Actions.
      # Use clearly-synthetic dummy values for anything that just needs to be present.
      - name: Run tests
        env:
          SERVER_HOST: "http://localhost:8000"
          FRONTEND_URL: "http://localhost:3000"
          DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/test_db"
          REDIS_URL: "redis://localhost:6379/0"
          SECRET_KEY: ${{ secrets.CI_SECRET_KEY }}
          ENVIRONMENT: "test"
          # Add any third-party API keys your tests need here, pulling from repo secrets.
          # By convention, name them CI_* (e.g., CI_STRIPE_API_KEY, CI_SUPABASE_JWT_SECRET).
          # Use clearly-synthetic test values in the secrets — never real production keys.
          # Example:
          #   STRIPE_API_KEY: ${{ secrets.CI_STRIPE_API_KEY }}
        run: poetry run pytest tests/ -v --cov=app --cov-report=xml --cov-report=term

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

  semgrep-scan:
    name: SAST (Semgrep, source-code patterns)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Runs in parallel with lint + test. Blocks the build step.
    # If scripts/security-scan.sh is absent (project hasn't adopted it yet), the
    # step no-ops so CI doesn't break.
    steps:
      - uses: actions/checkout@v4

      - name: Install semgrep
        run: pipx install semgrep

      - name: Run security scan
        run: |
          if [ -x ./scripts/security-scan.sh ]; then
            ./scripts/security-scan.sh
          else
            echo "scripts/security-scan.sh not present; skipping semgrep SAST."
            echo "To enable: copy it from backend-devops-template/scripts/ and chmod +x."
          fi

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test, semgrep-scan]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: {{PROJECT_SLUG}}-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trivy-scan:
    name: SAST (Trivy, dependency CVEs)
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true
